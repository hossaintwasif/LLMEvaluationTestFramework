[pytest]
# Central pytest configuration. Jenkins runs pytest from the repo root and
# selects tests with -m <marker>, so markers used across the repo are
# registered here (otherwise pytest warns about unknown markers).
markers =
    testRag: evaluation tests for RAG / LLM answer quality (DeepEval)
    correctness: LLM-as-judge answer correctness tests
    slow: long-running tests (full model evaluation suites)

# Extra args for every pytest invocation (local + Jenkins).
addopts = -ra
